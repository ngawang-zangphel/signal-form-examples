<section class="flex flex-col gap-2">
    <h1 class="text-2xl font-semibold">Simple Form</h1>
    <form class="form">
      <div class="form--group">
        <label class="form--label" for="name">First Name</label>
        <div>
          <input class="form--input" type="text" id="name"  placeholder="Enter your first name"
          [formField]="simpleForm.firstName"
          />
        </div>
      </div>
      <div class="form--group">
        <label class="form--label" for="lName">Last Name</label>
        <div>
          <input class="form--input" type="text" id="lName"  placeholder="Enter your Last name"
          [formField]="simpleForm.lastName"
        />
        </div>
      </div>
      <div class="form--group">
        <label class="form--label" for="age">Age</label>
        <div>
          <input class="form--input" type="number" id="age"  placeholder="Enter your Age"
          [formField]="simpleForm.age"
          />
        </div>
      </div>
      <div class="form--group">
        <label class="form--label" for="hasExperience">Has Work Experience</label>
        <div class="">
          <input class="form--input size-5" type="checkbox" id="hasExperience"
          [formField]="simpleForm.hasExperience"
          />
        </div>
      </div>
      @if (!simpleForm.numberOfYears().hidden()) {
        <div class="form--group">
          <label class="form--label" for="experienceYears">Experience Years</label>
          <div>
            <input class="form--input" type="number" id="experienceYears"  placeholder="Number of years"
            [formField]="simpleForm.numberOfYears"
            />
          </div>
        </div>
      }
    </form>
    <div class="flex flex-col gap-2 mt-2">
      <pre>Form Valid: {{ simpleForm().valid() }}</pre>
      <pre>Form Data: {{ simpleFormModel() | json }}</pre>
    </div>
</section>
