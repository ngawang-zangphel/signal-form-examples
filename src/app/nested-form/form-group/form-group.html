<section class="mx-2 my-3 p-2 border rounded-xl">
    <app-condition-action-header [condition]="ruleGroup().condition" (addNewSubGroup)="addNewSubGroup()" (addNewRule)="addNewRule()"(remove)="removeCondition.emit()"/>
    <div class="flex flex-col gap-2">
        @for (group of ruleGroup().groups; track $index) {
            <app-form-group [ruleGroup]="group" (removeCondition)="removeSubFormGroup($index)"></app-form-group>
        }
        @for (rule of ruleGroup().rules; track $index) {
            <div>
                <app-condition-form></app-condition-form>
            </div>
        }
    </div>
</section>
